---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: workloadidentitybindings.iam.thalassa.cloud
spec:
  group: iam.thalassa.cloud
  names:
    kind: WorkloadIdentityBinding
    listKind: WorkloadIdentityBindingList
    plural: workloadidentitybindings
    shortNames:
    - wib
    singular: workloadidentitybinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .serviceAccountName
      name: SA
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.policyID
      name: Policy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].lastTransitionTime
      name: LastTransition
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          WorkloadIdentityBinding binds a namespaced ServiceAccount to Thalassa WIF.
          Desired fields live at the root (RoleBinding-style), not under spec.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          deleteResources:
            description: DeleteResources deletes managed Thalassa resources when this
              binding is deleted.
            type: boolean
          identityConfigMap:
            description: |-
              IdentityConfigMap, when true, syncs ConfigMap wif-<serviceAccountName> with
              organisation-id / service-account-id (and project-id when configured) for pod mounts.
              Can also be enabled cluster-wide with --enable-identity-configmap.
            type: boolean
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          nameOverride:
            description: NameOverride overrides the Thalassa service account display
              name.
            type: string
          policyRef:
            description: |-
              PolicyRef is an IAM policy identity (preferred), slug, or name.
              Prefer the stable policy identity; status.policyID always records the resolved identity.
            type: string
          roleRef:
            description: |-
              RoleRef is an organisation role identity, slug, or name (transitional).
              At least one of policyRef or roleRef is required.
            type: string
          scopes:
            default:
            - openid
            description: Scopes are OIDC token scopes. Empty defaults to openid.
            items:
              type: string
            type: array
          serviceAccountName:
            description: ServiceAccountName is the Kubernetes ServiceAccount in this
              namespace.
            minLength: 1
            type: string
          status:
            description: Status is the observed state.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              federatedIdentityID:
                description: FederatedIdentityID is the Thalassa federated identity
                  identity.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last finished
                  a reconcile.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the controller.
                format: int64
                type: integer
              organisationID:
                description: OrganisationID is the Thalassa organisation used for
                  OIDC token exchange.
                type: string
              phase:
                description: Phase is Pending, Ready, or Error.
                type: string
              policyID:
                description: |-
                  PolicyID is the resolved Thalassa IAM policy identity (never slug/name).
                  Prefer this value over policyRef for lookups and cleanup.
                type: string
              projectID:
                description: ProjectID is the Thalassa project identity when the controller
                  runs with --project.
                type: string
              providerID:
                description: ProviderID is the cluster OIDC identity provider identity.
                type: string
              serviceAccountID:
                description: ServiceAccountID is the Thalassa service account identity.
                type: string
            type: object
        required:
        - serviceAccountName
        type: object
        x-kubernetes-validations:
        - message: at least one of policyRef or roleRef is required
          rule: (has(self.policyRef) && size(self.policyRef) > 0) || (has(self.roleRef)
            && size(self.roleRef) > 0)
        - message: wildcard policyRef is not allowed
          rule: '!has(self.policyRef) || self.policyRef != ''*'''
        - message: wildcard roleRef is not allowed
          rule: '!has(self.roleRef) || self.roleRef != ''*'''
        - message: wildcard scope is not allowed
          rule: '!has(self.scopes) || self.scopes.all(s, s != ''*'')'
    served: true
    storage: true
    subresources:
      status: {}
