{{- if .Values.rbac.create }}
{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "twic.fullname" . }}-controller
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["iam.thalassa.cloud"]
    resources: ["workloadidentitybindings"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["iam.thalassa.cloud"]
    resources: ["workloadidentitybindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["iam.thalassa.cloud"]
    resources: ["workloadidentitybindings/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "twic.fullname" . }}-controller
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "twic.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "twic.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controller.leaderElect }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "twic.fullname" . }}-leader-election
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "twic.fullname" . }}-leader-election
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "twic.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "twic.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.webhook.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "twic.fullname" . }}-webhook
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "twic.fullname" . }}-webhook
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "twic.fullname" . }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ include "twic.webhookServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
