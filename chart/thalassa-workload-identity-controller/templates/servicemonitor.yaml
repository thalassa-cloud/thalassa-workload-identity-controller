{{- if .Values.enableServiceMonitor }}
{{- if not .Values.metrics.enabled }}
{{- fail "enableServiceMonitor requires metrics.enabled to be true" }}
{{- end }}
{{- $m := .Values.metrics }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "twic.fullname" . }}-metrics
  labels:
    {{- include "twic.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: {{ $m.servicePort }}
      targetPort: https
  selector:
    {{- include "twic.selectorLabels" . | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "twic.fullname" . }}
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    {{- with $m.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "twic.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: https
      path: /metrics
      interval: {{ $m.serviceMonitor.interval }}
      {{- if $m.secure }}
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: {{ $m.serviceMonitor.tlsInsecureSkipVerify }}
      {{- end }}
{{- end }}
