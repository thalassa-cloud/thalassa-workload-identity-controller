{{- if .Values.controller.enabled }}
{{- if and (gt (int .Values.controller.replicaCount) 1) (not .Values.controller.leaderElect) }}
{{- fail "controller.leaderElect must be true when controller.replicaCount > 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twic.fullname" . }}-controller
  labels:
    {{- include "twic.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "twic.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twic.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "twic.controllerServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --enable-controllers=true
            - --enable-pod-mutator=false
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --health-probe-bind-address={{ .Values.controller.probeAddr }}
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --thalassa-url={{ .Values.thalassa.url }}
            - --organisation={{ required "thalassa.organisation is required when controller.enabled" .Values.thalassa.organisation }}
            {{- if .Values.thalassa.project }}
            - --project={{ .Values.thalassa.project }}
            {{- end }}
            - --cluster-identity={{ required "thalassa.clusterIdentity is required when controller.enabled" .Values.thalassa.clusterIdentity }}
            - --thalassa-service-account-id={{ required "thalassa.serviceAccountId is required when controller.enabled" .Values.thalassa.serviceAccountId }}
            - --requeue-missing-idp={{ .Values.controller.requeueMissingIDP }}
            - --enable-serviceaccount-annotations={{ .Values.controller.enableServiceAccountAnnotations }}
            - --enable-identity-configmap={{ .Values.controller.enableIdentityConfigMap }}
            {{- if .Values.controller.allowedPolicies }}
            - --allowed-policies={{ join "," .Values.controller.allowedPolicies }}
            {{- end }}
            {{- if .Values.controller.allowedRoles }}
            - --allowed-roles={{ join "," .Values.controller.allowedRoles }}
            {{- end }}
            {{- if .Values.thalassa.projectedToken.enabled }}
            - --thalassa-subject-token-file={{ .Values.thalassa.projectedToken.mountPath }}/{{ .Values.thalassa.projectedToken.path }}
            {{- end }}
            {{- if .Values.thalassa.trustedAudiences }}
            - --trusted-audiences={{ join "," .Values.thalassa.trustedAudiences }}
            {{- end }}
            {{- if .Values.controller.watchNamespaces }}
            - --watch-namespaces={{ join "," .Values.controller.watchNamespaces }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: https
              containerPort: {{ .Values.metrics.servicePort }}
            {{- end }}
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml (.Values.controller.resources | default .Values.resources) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.thalassa.projectedToken.enabled }}
            - name: thalassa-token
              mountPath: {{ .Values.thalassa.projectedToken.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.thalassa.projectedToken.enabled }}
        - name: thalassa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ .Values.thalassa.projectedToken.path }}
                  audience: {{ .Values.thalassa.projectedToken.audience | quote }}
                  expirationSeconds: {{ .Values.thalassa.projectedToken.expirationSeconds }}
        {{- end }}
{{- end }}
