replicaCount: 1
# Used by PodDisruptionBudget when replicaCount > 1.
minAvailable: 1

image:
  repository: ghcr.io/thalassa-cloud/thalassa-workload-identity-controller
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  # Empty = ClusterRole for all namespaces. Non-empty = Role per listed namespace
  # (watch filter only today; ClusterRole remains until namespaced Roles land).
  watchNamespaces: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

thalassa:
  url: "https://api.thalassa.cloud"
  organisation: ""
  # Optional. When set, IAM policy APIs use X-Project-Identity.
  # When empty, policyRef resolves in the organisation root scope.
  project: ""
  clusterIdentity: ""
  # Thalassa SA identity for the controller itself (bootstrapped once with tcloud).
  serviceAccountId: ""
  trustedAudiences: []
  # If empty, defaults to thalassa.url
  projectedToken:
    enabled: true
    mountPath: /var/run/secrets/thalassa
    path: token
    audience: "https://api.thalassa.cloud"
    expirationSeconds: 3600

controller:
  # Required when replicaCount > 1.
  leaderElect: true
  requeueMissingIDP: 30s
  probeAddr: ":8081"
  # Legacy ServiceAccount annotation reconciliation (default: off). Prefer CRs.
  enableServiceAccountAnnotations: false
  # Sync ConfigMap wif-<sa> for all Ready bindings (default: off).
  # Prefer per-binding identityConfigMap: true, or the pod mutator webhook.
  enableIdentityConfigMap: false
  # Optional allowlists (empty = allow any). Match identity, slug, or name.
  allowedPolicies: []
  allowedRoles: []

metrics:
  enabled: true
  bindAddress: ":8443"
  # Serve metrics over HTTPS with Kubernetes authn/authz.
  secure: true
  servicePort: 8443
  # Grant /metrics get to this ServiceAccount (e.g. Prometheus).
  prometheusServiceAccount:
    name: ""
    namespace: ""
  serviceMonitor:
    interval: 30s
    tlsInsecureSkipVerify: true
    labels: {}

enableServiceMonitor: false

# Optional mutating webhook: injects THALASSA_* env + projected token for pods
# labeled thalassa.cloud/wif.use=true when the SA has Ready WIF annotations.
# For HA: replicaCount >= 2, leaderElect true, failurePolicy Fail (see values-webhook-ha.yaml).
webhook:
  enabled: false
  port: 9443
  failurePolicy: Ignore
  certManager:
    enabled: true
  tls:
    # Used when certManager.enabled=false. Must contain tls.crt and tls.key.
    secretName: ""

networkPolicy:
  enabled: true
