image:
  repository: ghcr.io/thalassa-cloud/thalassa-workload-identity-controller
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

thalassa:
  url: "https://api.thalassa.cloud"
  organisation: ""
  # Optional. When set, IAM policy APIs use X-Project-Identity.
  project: ""
  clusterIdentity: ""
  serviceAccountId: ""
  trustedAudiences: []
  projectedToken:
    enabled: true
    mountPath: /var/run/secrets/thalassa
    path: token
    audience: "https://api.thalassa.cloud"
    expirationSeconds: 3600

# Reconciler (control plane or in-cluster). Requires Thalassa credentials.
controller:
  enabled: true
  replicaCount: 1
  leaderElect: true
  requeueMissingIDP: 30s
  probeAddr: ":8081"
  enableServiceAccountAnnotations: false
  enableIdentityConfigMap: false
  allowedPolicies: []
  allowedRoles: []
  # Empty = all namespaces (watch filter only).
  watchNamespaces: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}

# Pod mutator (must run in-cluster for admission). No Thalassa API access required.
webhook:
  enabled: false
  replicaCount: 1
  minAvailable: 1
  port: 9443
  failurePolicy: Ignore
  audience: "https://api.thalassa.cloud"
  probeAddr: ":8081"
  certManager:
    enabled: true
  tls:
    secretName: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}

metrics:
  enabled: true
  bindAddress: ":8443"
  secure: true
  servicePort: 8443
  prometheusServiceAccount:
    name: ""
    namespace: ""
  serviceMonitor:
    interval: 30s
    tlsInsecureSkipVerify: true
    labels: {}

enableServiceMonitor: false

rbac:
  create: true

networkPolicy:
  enabled: true
