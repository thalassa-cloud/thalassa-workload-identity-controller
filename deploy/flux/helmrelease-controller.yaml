apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: thalassa-workload-identity-controller
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: thalassa-system
  install:
    createNamespace: true
  dependsOn:
    - name: thalassa-workload-identity-controller-crds
      namespace: flux-system
  chart:
    spec:
      chart: thalassa-workload-identity-controller
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: thalassa-cloud-charts
        namespace: flux-system
  values:
    enableServiceMonitor: false
    thalassa:
      url: https://api.thalassa.cloud
      # Replace with real IDs after bootstrap (or use valuesFrom).
      organisation: "org-REPLACE_ME"
      clusterIdentity: "k8s-REPLACE_ME"
      serviceAccountId: "sa-REPLACE_ME"
      # project: "proj-REPLACE_ME"
    controller:
      enabled: true
      leaderElect: true
      # Tighten for production:
      # allowedPolicies: ["observability:RemoteWriteAccess"]
    # Self-managed: enable in-cluster mutator (or use values-incluster.yaml).
    # webhook:
    #   enabled: true
    # HA webhook overlay (values-webhook-ha.yaml):
    # webhook:
    #   enabled: true
    #   replicaCount: 2
    #   minAvailable: 1
    #   failurePolicy: Fail
