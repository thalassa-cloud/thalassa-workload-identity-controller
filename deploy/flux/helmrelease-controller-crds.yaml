apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: thalassa-workload-identity-controller-crds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  targetNamespace: thalassa-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: thalassa-workload-identity-controller-crds
      # Pin to the published chart; align with your Helm/OCI tag.
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: thalassa-cloud-charts
        namespace: flux-system
