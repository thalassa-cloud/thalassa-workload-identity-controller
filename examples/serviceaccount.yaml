apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-proxy
  namespace: monitoring
---
apiVersion: iam.thalassa.cloud/v1beta1
kind: WorkloadIdentityBinding
metadata:
  name: observability-proxy
  namespace: monitoring
spec:
  serviceAccountName: observability-proxy
  # Project or organisation-root IAM policy (omit thalassa.project for org root)
  policyRef: observability:RemoteWriteAccess
  # Transitional: organisation role (optional alongside or instead of policy)
  # roleRef: observability:RemoteWriteAccess
  # scopes default to ["api:read"]; set write explicitly when needed:
  # scopes: ["api:read", "api:write"]
  # nameOverride: obs-proxy-prod
  # deleteResources: true
---
# After the binding is Ready, the controller creates ConfigMap wif-observability-proxy
# with organisation-id + service-account-id (and project-id when configured).
# Mount it next to the projected JWT for OIDC token exchange.
apiVersion: v1
kind: Pod
metadata:
  name: example-consumer
  namespace: monitoring
spec:
  serviceAccountName: observability-proxy
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {}
      volumeMounts:
        - name: thalassa-wif
          mountPath: /var/run/secrets/thalassa
          readOnly: true
  volumes:
    - name: thalassa-wif
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: https://api.thalassa.cloud
              expirationSeconds: 3600
          - configMap:
              name: wif-observability-proxy
              items:
                - key: organisation-id
                  path: organisation-id
                - key: service-account-id
                  path: service-account-id
                # Present when the controller runs with --project / thalassa.project:
                # - key: project-id
                #   path: project-id
