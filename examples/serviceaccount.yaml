apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-proxy
  namespace: monitoring
---
apiVersion: iam.thalassa.cloud/v1beta1
kind: WorkloadIdentityBinding
metadata:
  name: observability-proxy
  namespace: monitoring
serviceAccountName: observability-proxy
# Project or organisation-root IAM policy (omit thalassa.project for org root)
policyRef: observability:RemoteWriteAccess
# Transitional: organisation role (optional alongside or instead of policy)
# roleRef: observability:RemoteWriteAccess
# scopes default to ["openid"]; add API scopes when needed:
# scopes: ["openid", "api:read", "api:write"]
# nameOverride: obs-proxy-prod
# deleteResources: true
# Sync ConfigMap wif-observability-proxy for pod mounts (also: --enable-identity-configmap):
# identityConfigMap: true
---
# Preferred: enable the pod mutator webhook (Helm webhook.enabled=true) and label
# the pod. The webhook injects THALASSA_* env vars + a projected JWT from the
# ServiceAccount annotations written when the binding is Ready.
apiVersion: v1
kind: Pod
metadata:
  name: example-consumer
  namespace: monitoring
  labels:
    thalassa.cloud/wif.use: "true"
spec:
  serviceAccountName: observability-proxy
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {}
# Fallback without webhook: set identityConfigMap: true on the binding (or
# controller.enableIdentityConfigMap) and mount ConfigMap wif-observability-proxy
# next to a projected token, e.g.:
#
#   volumes:
#     - name: thalassa-wif
#       projected:
#         sources:
#           - serviceAccountToken:
#               path: token
#               audience: https://api.thalassa.cloud
#               expirationSeconds: 3600
#           - configMap:
#               name: wif-observability-proxy
#               items:
#                 - key: organisation-id
#                   path: organisation-id
#                 - key: service-account-id
#                   path: service-account-id
